schemaVersion: 2.2.0
metadata:
  name: rust-development
  displayName: Rust Development Environment
  description: Prebuilt Rust + Nix dev container
  icon: https://www.rust-lang.org/logos/rust-logo-512x512.png
  tags:
    - Rust
    - Nix
  projectType: rust
  language: rust
  version: 1.0.0

# projects:
#   - name: example-project
#     git:
#       remotes:
#         origin: https://github.com/your-org/your-repo.git

components:
  - name: rust-dev
    container:
      image: harbor.ethosengine.com/devspaces/rust-nix-dev:latest
      memoryLimit: 6Gi
      memoryRequest: 1Gi
      cpuLimit: '2'
      cpuRequest: '500m'
      mountSources: true
      sourceMapping: /projects
      env:
        - name: CLAUDE_CONFIG_DIR
          value: /projects/.claude-config
        - name: RUST_BACKTRACE
          value: '1'
        - name: USER
          value: user
        # XDG directories now use /tmp (ephemeral) to avoid consuming PVC space
        # This matches the container's bashrc configuration
        - name: XDG_CACHE_HOME
          value: /tmp/nix-cache
        - name: XDG_DATA_HOME
          value: /tmp/nix-data
        - name: XDG_STATE_HOME
          value: /projects/.state
        - name: XDG_CONFIG_HOME
          value: /projects/.config
        - name: NPM_CONFIG_CACHE
          value: /tmp/nix-cache/npm
        # Nix configuration - CRITICAL for Holochain development in rootless containers
        - name: NIX_CONFIG
          value: |
            experimental-features = nix-command flakes
            sandbox = false
            substituters = https://cache.nixos.org https://holochain-ci.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=
            auto-optimise-store = true
            min-free = 5368709120
            max-free = 10737418240
            keep-outputs = false
            keep-derivations = false
      endpoints:
        - name: http-8080
          targetPort: 8080
          exposure: public
          protocol: https
        - name: debug-5005
          targetPort: 5005
          exposure: internal
      volumeMounts:
        - name: nix-store
          path: /nix
        - name: cargo-cache
          path: /home/user/.cargo
        - name: rustup-cache
          path: /home/user/.rustup

  # Nix store volume - 30Gi recommended for stable operation
  # Breakdown: Base Nix (2GB) + nixpkgs (500MB) + Rust (3GB) + builds (4GB) + buffer (20GB)
  - name: nix-store
    volume:
      size: 15Gi
  # Cargo cache - dependency artifacts and incremental builds
  - name: cargo-cache
    volume:
      size: 3Gi
  # Rustup toolchain cache - stable, nightly, components
  - name: rustup-cache
    volume:
      size: 2Gi

commands:
  - id: rust-init-project
    exec:
      label: "Initialize Rust Project"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        if [ ! -f Cargo.toml ]; then
          cargo init .
          echo "✅ Rust project initialized!"
        else
          echo "📦 Rust project already exists"
        fi

  - id: cargo-build
    exec:
      label: "Build Rust Project"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: cargo build
      group:
        kind: build
        isDefault: true

  - id: cargo-run
    exec:
      label: "Run Rust Project"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: cargo run
      group:
        kind: run
        isDefault: true

  - id: cargo-test
    exec:
      label: "Test Rust Project"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: cargo test
      group:
        kind: test
        isDefault: true

  - id: cargo-clippy
    exec:
      label: "Run Clippy Linter"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: cargo clippy -- -D warnings

  - id: cargo-fmt
    exec:
      label: "Format Code"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: cargo fmt

  - id: install-rust-analyzer
    exec:
      label: "Install Rust Analyzer (LSP)"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        if ! rustup component list --installed | grep -q rust-analyzer; then
          rustup component add rust-analyzer
          echo "✅ Rust Analyzer installed"
        else
          echo "📦 Rust Analyzer already installed"
        fi

  - id: nix-status
    exec:
      label: "Check Nix/Rust Status and Storage"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: nix-status

  - id: nix-clean
    exec:
      label: "Run Nix Garbage Collection"
      component: rust-dev
      workingDir: ${PROJECT_SOURCE}
      commandLine: nix-clean

  - id: setup-vscode-cli
    exec:
      component: rust-dev
      commandLine: |
        # Create VS Code CLI symlink (code-oss -> code)
        # checode only ships ubi8/ubi9 binaries, use ubi9 (forward compatible with ubi10)
        mkdir -p /home/user/.local/bin
        if [ -f /checode/checode-linux-libc/ubi9/bin/remote-cli/code-oss ]; then
          ln -sf /checode/checode-linux-libc/ubi9/bin/remote-cli/code-oss /home/user/.local/bin/code
        fi

        # Link ~/.claude to persistent config dir for VS Code extension IDE detection
        # The extension uses ~/.claude/ide for IPC sockets, must match CLAUDE_CONFIG_DIR
        rm -rf /home/user/.claude 2>/dev/null || true
        ln -sf "$CLAUDE_CONFIG_DIR" /home/user/.claude
        mkdir -p /home/user/.claude/ide

events:
  postStart:
    - setup-vscode-cli
