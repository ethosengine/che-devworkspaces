schemaVersion: 2.2.0
metadata:
  name: udi-plus-workspace
  displayName: Che Image and Workspace Development
  description: >-
    Universal Developer Image provides various programming languages tools and
    runtimes for instant coding, plus ai utilities
  icon: >-
    https://raw.githubusercontent.com/devfile/devfile-web/main/apps/landing-page/public/pwa-192x192.png
  tags:
    - Java
    - Maven
    - Scala
    - PHP
    - .NET
    - Node.js
    - Go
    - Python
    - Pip
    - ubi10
    - Claude
  projectType: universal
  language: Polyglot
  version: 1.0.0
  projects:
  - name: che-devworkspaces
    git:
      remotes:
        origin: https://github.com/ethosengine/che-devworkspaces.git
components:
  - name: tools
    container:
      image: harbor.ethosengine.com/devspaces/udi-plus:latest
      memoryLimit: 4G
      memoryRequest: 1G
      mountSources: true
      env:
        - name: CLAUDE_CONFIG_DIR
          value: /projects/.claude-config
        - name: XDG_CONFIG_HOME
          value: /projects/.config
        - name: XDG_CACHE_HOME
          value: /projects/.cache
        - name: CHROME_BIN
          value: /usr/local/bin/chrome
        - name: CHROME_PATH
          value: /opt/chrome-linux64/chrome

commands:
  - id: setup-vscode-cli
    exec:
      component: tools
      commandLine: |
        # Create VS Code CLI symlink (code-oss -> code)
        # checode only ships ubi8/ubi9 binaries, use ubi9 (forward compatible with ubi10)
        mkdir -p /home/user/.local/bin
        if [ -f /checode/checode-linux-libc/ubi9/bin/remote-cli/code-oss ]; then
          ln -sf /checode/checode-linux-libc/ubi9/bin/remote-cli/code-oss /home/user/.local/bin/code
        fi

        # === Claude Code Persistence Setup ===
        # Claude Code has known issues with CLAUDE_CONFIG_DIR (partially respected):
        # - VS Code extension hardcodes ~/.claude/ide/ for IPC sockets
        # - CLI uses $CLAUDE_CONFIG_DIR/ide/ for IPC socket detection
        # - ~/.claude.json is hardcoded to home directory (ignores CLAUDE_CONFIG_DIR)
        # See: https://github.com/anthropics/claude-code/issues/4739
        # See: https://github.com/anthropics/claude-code/issues/3833
        #
        # Our solution: Symlink ~/.claude -> $CLAUDE_CONFIG_DIR so both paths resolve
        # to the same persistent location on /projects PVC.

        # Ensure persistent config directory exists
        mkdir -p "$CLAUDE_CONFIG_DIR"
        mkdir -p "$CLAUDE_CONFIG_DIR/ide"

        # Remove any existing ~/.claude (dir or file) and create symlink
        rm -rf /home/user/.claude 2>/dev/null || true
        ln -sf "$CLAUDE_CONFIG_DIR" /home/user/.claude

        # Symlink ~/.claude.json -> persistent location (hardcoded file, not in ~/.claude/)
        rm -f /home/user/.claude.json 2>/dev/null || true
        ln -sf "$CLAUDE_CONFIG_DIR/.claude.json" /home/user/.claude.json

events:
  postStart:
    - setup-vscode-cli
